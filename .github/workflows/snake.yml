name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # allows manual trigger from GitHub UI
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00ff41&color_dots[0]=#0d1117&color_dots[1]=#003b00&color_dots[2]=#006600&color_dots[3]=#00aa00&color_dots[4]=#00ff41
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00ff41&color_dots[0]=#0d1117&color_dots[1]=#003b00&color_dots[2]=#006600&color_dots[3]=#00aa00&color_dots[4]=#00ff41

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          force_orphan: true